name: Build APT repo from my deb packages build and publish to gh-pages

on:
  workflow_dispatch:
  # schedule:
  # - cron: "0 */6 * * *"   # every 6 hours (optional)

env:
  OWNER: serbozanrevd
  REPOS: |
    kvrocks-fpm
    poppy-fpm
    bgpkit-parser-fpm
    certstream-server-rust-fpm

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gpg

      - name: Create repo structure
        run: |
          rm -rf out
          mkdir -p out/pool

      # ---- Download .deb assets from my repositories ----
      - name: Download debs from all repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh auth status
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            tag="$(gh release list --repo "${{ env.OWNER }}/$repo" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')"
            echo "$repo -> $tag"
            tmpdir=$(mktemp -d)
            gh release download "$tag" \
              --repo "${{ env.OWNER }}/$repo" \
              --pattern "*.deb" \
              -D "$tmpdir"
            for f in "$tmpdir"/*.deb; do
              [ -f "$f" ] || continue
              orig="$(basename "$f")"
              # Route to suite based on -uNN suffix; default to noble (u24)
              uver="$(echo "$orig" | sed -n 's/.*-u\([0-9]\+\)\.deb$/\1/p')"
              if [ -n "$uver" ]; then
                case "u$uver" in
                  u22) suite=jammy  ;;
                  u24) suite=noble  ;;
                  u26) suite=plucky ;;
                  *)   suite=noble  ;;
                esac
                dest="$(echo "$orig" | sed "s/-u${uver}\.deb$/.deb/")"
              else
                suite=noble
                dest="$orig"
              fi
              # Normalize non-standard Architecture field (e.g. linux-amd64 → amd64)
              raw_arch="$(dpkg-deb --field "$f" Architecture)"
              case "$raw_arch" in
                amd64|arm64|i386|armhf|all) ;;
                *amd64*)
                  tmpd="$(mktemp -d)" && dpkg-deb -R "$f" "$tmpd"
                  sed -i 's/^Architecture: .*/Architecture: amd64/' "$tmpd/DEBIAN/control"
                  dpkg-deb --build "$tmpd" "$f" && rm -rf "$tmpd" ;;
                *arm64*|*aarch64*)
                  tmpd="$(mktemp -d)" && dpkg-deb -R "$f" "$tmpd"
                  sed -i 's/^Architecture: .*/Architecture: arm64/' "$tmpd/DEBIAN/control"
                  dpkg-deb --build "$tmpd" "$f" && rm -rf "$tmpd" ;;
              esac
              mkdir -p "out/pool/$suite/main"
              mkdir -p "out/dists/$suite/main/binary-amd64"
              mkdir -p "out/dists/$suite/main/binary-arm64"
              cp "$f" "out/pool/$suite/main/$dest"
              printf '%s\t%s\thttps://github.com/${{ env.OWNER }}/%s\n' \
                "$suite" "$dest" "$repo" >> out/.source-map.tsv
            done
            rm -rf "$tmpdir"
          done <<< "${{ env.REPOS }}"

      - name: Verify we have debs
        run: |
          find out/pool -name "*.deb" | sort
          test "$(find out/pool -name '*.deb' | wc -l)" -gt 0

      - name: Copy static assets
        run: |
          cp apt-repo.gpg.key out/
          cp banner.svg out/

      # ---- Generate APT metadata ----
      - name: Generate Packages and Packages.gz
        run: |
          cat > /tmp/filter_packages.py << 'EOF'
          import re, sys
          suite = sys.argv[1]
          def split_stanzas(text):
              return [b + '\n' for b in re.split(r'\n\n+', text.strip()) if b.strip()]
          def arch_of(s):
              m = re.search(r'^Architecture: (.+)$', s, re.MULTILINE)
              return m.group(1).strip() if m else ''
          stanzas = split_stanzas(open('/tmp/all_packages').read())
          for arch, path in [
              ('amd64', f'dists/{suite}/main/binary-amd64/Packages'),
              ('arm64', f'dists/{suite}/main/binary-arm64/Packages'),
          ]:
              filtered = [s for s in stanzas if arch_of(s) in (arch, 'all')]
              open(path, 'w').write('\n'.join(filtered) + '\n')
          EOF
          cd out
          for suite_dir in dists/*/; do
            suite="$(basename "$suite_dir")"
            pool="pool/$suite/main"
            [ -d "$pool" ] || continue
            dpkg-scanpackages "$pool" /dev/null > /tmp/all_packages
            python3 /tmp/filter_packages.py "$suite"
            gzip -9 -c "dists/$suite/main/binary-amd64/Packages" > "dists/$suite/main/binary-amd64/Packages.gz"
            gzip -9 -c "dists/$suite/main/binary-arm64/Packages" > "dists/$suite/main/binary-arm64/Packages.gz"
          done

      - name: Generate Release files
        run: |
          cd out
          for suite_dir in dists/*/; do
            suite="$(basename "$suite_dir")"
            apt-ftparchive \
              -o APT::FTPArchive::Release::Suite="$suite" \
              -o APT::FTPArchive::Release::Codename="$suite" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              release "dists/$suite" > "dists/$suite/Release"
          done

      - name: Import GPG key and sign Release files
        env:
          GPG_KEY: ${{ secrets.GPG_ARMORED_KEY }}
        run: |
          set -e
          [ -z "$GPG_KEY" ] && { echo "ERROR: GPG_ARMORED_KEY secret is empty or not set"; exit 1; }
          echo "$GPG_KEY" | base64 -d | gpg --batch --import
          gpg --list-keys --keyid-format=long
          gpg --list-secret-keys --keyid-format=long

          cd out
          for suite_dir in dists/*/; do
            suite="$(basename "$suite_dir")"
            gpg --batch --yes --pinentry-mode loopback \
              --armor \
              --output "dists/$suite/Release.gpg" \
              --detach-sign "dists/$suite/Release"
            gpg --batch --yes --pinentry-mode loopback \
              --armor \
              --output "dists/$suite/InRelease" \
              --clearsign "dists/$suite/Release"
          done

      - name: Generate index page
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          PAGES_URL="https://${{ env.OWNER }}.github.io/${REPO_NAME}"
          python3 - "$PAGES_URL" <<'PYEOF'
          import sys, os, glob, subprocess, collections
          url = sys.argv[1]

          source_map = {}  # (suite, fname) -> repo_url
          tsv = "out/.source-map.tsv"
          if os.path.exists(tsv):
              for line in open(tsv):
                  parts = line.strip().split("\t")
                  if len(parts) == 3:
                      source_map[(parts[0], parts[1])] = parts[2]

          SUITE_ORDER = ["jammy", "noble", "plucky"]
          SUITE_LABEL = {
              "jammy":  "Ubuntu 22.04 (Jammy)",
              "noble":  "Ubuntu 24.04 (Noble)",
              "plucky": "Ubuntu 26.04 (Plucky)",
          }

          packages_by_suite = collections.defaultdict(list)
          for deb in sorted(glob.glob("out/pool/*/main/*.deb")):
              parts = deb.split("/")  # out / pool / <suite> / main / <file>
              suite = parts[2]
              fname = os.path.basename(deb)
              raw = subprocess.check_output(["dpkg-deb", "--field", deb], text=True)
              f = {}
              for line in raw.splitlines():
                  if ": " in line and not line.startswith(" "):
                      k, v = line.split(": ", 1)
                      f[k] = v
              homepage = f.get("Homepage", "")
              pkg_name = f.get("Package", "?")
              pkg_label = (f'<a href="{homepage}" target="_blank" rel="noopener"><strong>{pkg_name}</strong></a>'
                           if homepage else f'<strong>{pkg_name}</strong>')
              repo_url = source_map.get((suite, fname), "")
              repo_link = f' <a href="{repo_url}" target="_blank" rel="noopener">[source]</a>' if repo_url else ""
              packages_by_suite[suite].append(
                  f'<li><a href="pool/{suite}/main/{fname}">[.deb]</a> {pkg_label}'
                  f' {f.get("Version","?")} ({f.get("Architecture","?")})'
                  f' &mdash; {f.get("Description","")}{repo_link}</li>'
              )

          present_suites = [s for s in SUITE_ORDER if s in packages_by_suite]
          for s in sorted(packages_by_suite):
              if s not in present_suites:
                  present_suites.append(s)

          sections = []
          for suite in present_suites:
              label = SUITE_LABEL.get(suite, suite.capitalize())
              items = "\n".join(packages_by_suite[suite])
              sections.append(f"""<h3>{label}</h3>
          <p><code>deb [signed-by=/etc/apt/keyrings/serbozanrevd.gpg] {url} {suite} main</code></p>
          <ul>
          {items}
          </ul>""")

          pkg_sections = "\n".join(sections)
          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>APT Repository — the-package-whisperer</title>
          <style>
          body {{ font-family: monospace; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }}
          pre {{ background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }}
          li {{ margin: 0.4rem 0; }}
          </style>
          </head>
          <body>
          <img src="banner.svg" alt="the-package-whisperer" style="width:100%;max-width:500px;display:block;margin:0 auto 2rem">
          <h2>Setup</h2>
          <p><strong>1. Import GPG key</strong></p>
          <pre>curl -fsSL {url}/apt-repo.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/serbozanrevd.gpg</pre>
          <p><strong>2a. Add repository (.list — legacy)</strong></p>
          <pre>echo "deb [signed-by=/etc/apt/keyrings/serbozanrevd.gpg] {url} noble main" \\
            | sudo tee /etc/apt/sources.list.d/serbozanrevd.list</pre>
          <p><strong>2b. Add repository (.sources — DEB822, recommended)</strong></p>
          <pre>sudo tee /etc/apt/sources.list.d/serbozanrevd.sources &lt;&lt; 'EOF'
          Types: deb
          URIs: {url}
          Suites: noble
          Components: main
          Signed-By: /etc/apt/keyrings/serbozanrevd.gpg
          EOF</pre>
          <p><strong>3. Update &amp; install</strong></p>
          <pre>sudo apt-get update
          sudo apt-get install &lt;package-name&gt;</pre>
          <h2>Packages</h2>
          {pkg_sections}
          </body>
          </html>
          """
          open("out/index.html", "w").write(html)
          PYEOF

      # ---- Publish to GitHub Pages ----
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
