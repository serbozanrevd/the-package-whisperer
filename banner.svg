<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <defs>
    <radialGradient id="vinyl-g" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d2825"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </radialGradient>
    <radialGradient id="label-g" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8c46a"/>
      <stop offset="100%" stop-color="#8a5f10"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="250" fill="#12100e" rx="8"/>

  <!-- Sound waves LEFT (CCW, sweep=0) -->
  <g fill="none" stroke="#c9a84c" stroke-linecap="round">
    <path d="M 200,38.4 A 100,100 0 0,0 200,211.6" stroke-width="1.5" opacity="0.55"/>
    <path d="M 193.5,27.1 A 113,113 0 0,0 193.5,222.9" stroke-width="1.2" opacity="0.4"/>
    <path d="M 187,15.9 A 126,126 0 0,0 187,234.1" stroke-width="1" opacity="0.25"/>
    <path d="M 180.5,4.6 A 139,139 0 0,0 180.5,245.4" stroke-width="0.8" opacity="0.15"/>
  </g>

  <!-- Sound waves RIGHT (CW, sweep=1) -->
  <g fill="none" stroke="#c9a84c" stroke-linecap="round">
    <path d="M 300,38.4 A 100,100 0 0,1 300,211.6" stroke-width="1.5" opacity="0.55"/>
    <path d="M 306.5,27.1 A 113,113 0 0,1 306.5,222.9" stroke-width="1.2" opacity="0.4"/>
    <path d="M 313,15.9 A 126,126 0 0,1 313,234.1" stroke-width="1" opacity="0.25"/>
    <path d="M 319.5,4.6 A 139,139 0 0,1 319.5,245.4" stroke-width="0.8" opacity="0.15"/>
  </g>

  <!-- Vinyl disc -->
  <circle cx="250" cy="125" r="90" fill="url(#vinyl-g)"/>

  <!-- Top highlight -->
  <path d="M 190,60 A 90,90 0 0,1 310,60" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.06"/>

  <!-- Grooves -->
  <g fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5">
    <circle cx="250" cy="125" r="38"/>
    <circle cx="250" cy="125" r="43"/>
    <circle cx="250" cy="125" r="48"/>
    <circle cx="250" cy="125" r="53"/>
    <circle cx="250" cy="125" r="58"/>
    <circle cx="250" cy="125" r="63"/>
    <circle cx="250" cy="125" r="68"/>
    <circle cx="250" cy="125" r="73"/>
    <circle cx="250" cy="125" r="78"/>
    <circle cx="250" cy="125" r="83"/>
    <circle cx="250" cy="125" r="88"/>
  </g>

  <!-- Center label -->
  <circle cx="250" cy="125" r="30" fill="url(#label-g)"/>

  <!-- Package icon: box body, lid, tape strip -->
  <rect x="240" y="127" width="20" height="13" rx="1" fill="#1a1206"/>
  <path d="M 240,127 L 250,122 L 260,127 Z" fill="#1a1206"/>
  <rect x="248" y="122" width="4" height="18" rx="1" fill="#c9a84c" opacity="0.6"/>

  <!-- Spindle hole -->
  <circle cx="250" cy="125" r="2.5" fill="#12100e"/>

  <!-- Art deco horizontal lines -->
  <g stroke="#c9a84c" opacity="0.3" stroke-width="0.5">
    <line x1="15" y1="120" x2="175" y2="120"/>
    <line x1="15" y1="130" x2="175" y2="130"/>
    <line x1="325" y1="120" x2="485" y2="120"/>
    <line x1="325" y1="130" x2="485" y2="130"/>
  </g>

  <!-- Title -->
  <text x="250" y="244" text-anchor="middle" fill="#c9a84c"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="3">the-package-whisperer</text>
</svg>
